name: Build VoiceProbe APK

on:
  push:
    branches: [ 'build/voiceprobe-s21fe' ]
    paths:
      - 'VoiceProbe/**'
      - '.github/workflows/build-voiceprobe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: VoiceProbe
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp VoiceProbe/app/build/outputs/apk/debug/app-debug.apk output/VoiceProbe-S21FE-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceProbe-S21FE-v0.1.0-APK
          path: output/VoiceProbe-S21FE-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
